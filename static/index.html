<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Intern Thersites - Local Console</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📜</text></svg>">
    <link rel="stylesheet" href="/static/style.css?v=7">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <div class="logo-icon">📜</div>
                <div class="header-titles">
                    <h1>Local Intern Thersites</h1>
                    <span class="sub-title">The Local Intern Console (Qwen3.5-9B)</span>
                </div>
            </div>
            <div class="header-center">
                <label for="sessionSelect" style="color: var(--text-muted); font-size: 0.85rem;">Session:</label>
                <select id="sessionSelect" class="session-dropdown"></select>
                <button id="newSessionBtn" class="btn btn-secondary">+ New Session</button>
            </div>
            <div class="header-right">
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span class="status-text">qwen3.5:9b</span>
                </div>
                <div class="perf-tag" id="perfTag">⚡ -- tok/s</div>
                <div class="rolling-badge" id="rollingBadge">Rolling: 0 / 20k</div>
            </div>
        </header>

        <div class="main-layout">
            <aside class="pinned-sidebar">
                <div class="sidebar-header">
                    <h3>📌 Pinned 5k Buffer</h3>
                    <span class="pinned-count-badge" id="pinnedBadge">0 / 5,000 chars</span>
                </div>
                <div class="pinned-content" id="pinnedContainer">
                    <div class="empty-pinned">No pinned context anchors.</div>
                </div>
            </aside>

            <main class="timeline-area">
                <div class="timeline-header">
                    <h2>📜 Conversation Timeline (Full History from Msg #1)</h2>
                </div>
                
                <div class="timeline-container" id="timelineContainer">
                    <!-- Dynamic Messages Loaded Here -->
                </div>

                <div class="scratchpad-accordion" id="scratchpadAccordion">
                    <div class="accordion-header" id="accordionHeader">
                        <span class="accordion-title">🟡 Intern is thinking... (Turn 1/5)</span>
                        <span class="accordion-icon">▼</span>
                    </div>
                    <div class="accordion-body" id="accordionBody">
                        <!-- Live SSE Scratch Steps -->
                    </div>
                </div>

                <form class="chat-input-form" id="chatForm">
                    <textarea id="promptInput" placeholder="Give Thersites an instruction (or leave blank to run pinned instructions)..." rows="2"></textarea>
                    <button type="submit" id="sendBtn" class="btn btn-primary">Send Prompt 🚀</button>
                </form>
            </main>
        </div>
    </div>

    <script src="/static/app.js?v=7"></script>
</body>
</html>
