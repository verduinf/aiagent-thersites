<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Intern Thersites - Local Console</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128481;&#65039;</text></svg>">
    <link rel="stylesheet" href="/static/style.css?v=15">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2&bull;family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span class="status-text">qwen3.5:9b</span>
                </div>
                <div class="perf-tag" id="perfTag">&bull; -- tok/s</div>
                <div class="rolling-badge" id="rollingBadge">Rolling: 0 / 20k</div>
            </div>
            <div class="header-right">
                <label for="sessionSelect" style="color: var(--text-muted); font-size: 0.85rem;">Session:</label>
                <select id="sessionSelect" class="session-dropdown"></select>
                <button id="newSessionBtn" class="btn btn-secondary">+ New Session</button>
            </div>
        </header>

        <div class="main-layout">
            <aside class="pinned-sidebar">
                <div class="sidebar-header">
                    <h3>&#128205; Pinned 5k Buffer</h3>
                    <span class="pinned-count-badge" id="pinnedBadge">0 / 5,000 chars</span>
                </div>
                <div class="pinned-content" id="pinnedContainer">
                    <div class="empty-pinned">No pinned context anchors.</div>
                </div>
                <div class="sidebar-footer intern-profile-card">
                    <div class="intern-avatar-frame">
                        <img src="/static/images/thersites.png" alt="Thersites" class="intern-portrait-img">
                        <span class="avatar-status-pip" title="Active in VRAM"></span>
                    </div>
                    <div class="intern-info">
                        <div class="intern-name">Thersites</div>
                        <div class="intern-role">Local AI Intern</div>
                        <div class="intern-spec">Qwen3.5-9B &bull; GBNF JSON</div>
                    </div>
                </div>
            </aside>

            <main class="timeline-area">
                <div class="timeline-header">
                    <h2>&#128220; Conversation Timeline (Full History from Msg #1)</h2>
                </div>
                
                <div class="timeline-container" id="timelineContainer">
                    <!-- Dynamic Messages Loaded Here -->
                </div>

                <div class="scratchpad-accordion" id="scratchpadAccordion">
                    <div class="accordion-header" id="accordionHeader">
                        <span class="accordion-title">&bull;&bull; Intern is thinking... (Turn 1/5)</span>
                        <span class="accordion-icon">&bull;</span>
                    </div>
                    <div class="accordion-body" id="accordionBody">
                        <!-- Live SSE Scratch Steps -->
                    </div>
                </div>

                <div class="image-preview-tray" id="imagePreviewTray" style="display:none;"></div>
                <form class="chat-input-form" id="chatForm">
                    <input type="file" id="imageInput" accept="image/*" style="display:none;">
                    <textarea id="promptInput" placeholder="Give Thersites an instruction (or attach an image)..." rows="2"></textarea>
                    <div class="chat-form-actions">
                        <button type="button" id="attachBtn" class="btn btn-secondary" title="Attach Image">&#128065;&#65039; Attach</button>
                        <button type="submit" id="sendBtn" class="btn btn-primary">Send &#128640;</button>
                    </div>
                </form>
            </main>
        </div>
    </div>

    <script src="/static/app.js?v=16"></script>
</body>
</html>
